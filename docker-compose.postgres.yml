services:
  api:
    environment:
      DB_OPTION: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env before enabling PostgreSQL}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-vector_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env before enabling PostgreSQL}
      POSTGRES_DB: ${DB_NAME:-semantic_search_db}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    shm_size: 1gb
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgvector_data:
